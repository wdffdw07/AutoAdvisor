<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Copilot 胶囊</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="capsule-card" id="capsuleCard">
    <div class="capsule-header">
      <div class="capsule-title">
        <div class="icon">✦</div>
        <span>AutoDirector Copilot</span>
      </div>
      <span class="status-badge idle" id="statusBadge">空闲</span>
    </div>

    <div class="capsule-body" id="capsuleBody">
      <div class="goal-section" id="goalSection">
        <label>你想完成什么？</label>
        <div class="goal-input-wrap">
          <input
            type="text"
            class="goal-input"
            id="goalInput"
            placeholder="例：给图片加弹跳入场效果"
            maxlength="120"
          >
        </div>
        <p class="goal-shortcut-hint">
          按 <kbd class="shortcut-key">F9</kbd> 也可唤起并捕获目标窗口
        </p>
        <div class="capture-hint" id="idleCaptureHint"></div>
      </div>

      <div class="capsule-scroll hidden" id="capsuleScrollRegion">
        <div class="goal-display hidden" id="goalDisplay">
          <div class="goal-display-header">
            <div class="goal-label">目标</div>
            <button class="icon-button hidden" id="goalRestartButton" aria-label="重新开始">↻</button>
          </div>
          <div id="goalDisplayText"></div>
          <div class="goal-window-context" id="windowCtxBadge"></div>
        </div>

        <div class="progress-section hidden" id="progressSection">
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
          </div>
          <span class="progress-label" id="progressLabel">0/0</span>
        </div>

        <div class="plan-list hidden" id="planList"></div>

        <div class="step-card hidden" id="stepCard">
          <span class="step-action-badge click" id="stepActionBadge">点击</span>
          <div class="step-description" id="stepDescription">—</div>
          <div class="step-tooltip" id="stepTooltip"></div>
          <div class="step-reason hidden" id="stepReason"></div>
        </div>

        <div class="waiting-indicator hidden" id="waitingIndicator">
          <span class="pulse-dot"></span>
          <span id="waitingText">正在等待你完成操作…</span>
        </div>

        <div class="done-card hidden" id="doneCard">
          <div class="done-icon">✓</div>
          <div id="doneSummary">引导完成</div>
        </div>
      </div>

      <div class="cursor-tooltip hidden" id="restartTooltip">重新开始当前引导</div>
    </div>

    <div class="capsule-footer">
      <button class="btn btn-primary" id="btnStart">开始引导</button>
      <button class="btn btn-primary hidden" id="btnNext" disabled>下一步</button>
      <button class="btn btn-ghost hidden" id="btnComplete">已完成</button>
    </div>
  </div>

  <script src="capture_feedback.js"></script>
  <script src="capsule.js"></script>
</body>
</html>
